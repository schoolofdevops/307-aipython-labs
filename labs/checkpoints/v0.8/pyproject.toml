[project]
name = "platformops"
version = "0.8.0"
description = "PlatformOps Toolkit — inspect, validate and troubleshoot your services from one command line"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
]

[project.scripts]
platformops = "platformops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.1",
]
