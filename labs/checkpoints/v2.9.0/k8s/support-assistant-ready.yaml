# The clean case: a healthy Deployment, running the same model version the
# service definition claims (model-version: "4"), with resource requests
# declared. This is what ai-release-check reports PASS/PASS/PASS against.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-assistant
  namespace: ml-serving
  labels:
    app: support-assistant
    model-version: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-assistant
  template:
    metadata:
      labels:
        app: support-assistant
        model-version: "4"
    spec:
      containers:
        - name: support-assistant
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "true"]
            initialDelaySeconds: 2
            periodSeconds: 5
