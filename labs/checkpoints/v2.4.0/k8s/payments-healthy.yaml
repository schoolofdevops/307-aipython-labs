# Contrast case: a healthy, steady-state Deployment -- every replica
# requested, ready and available, no restarts, no warning events. This is
# what the inspector reports when nothing is wrong, so the failure
# scenarios have something real to be compared against.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: payments
  labels:
    app: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "true"]
            initialDelaySeconds: 2
            periodSeconds: 5
